<!-- SEO
og:title: Behind the Scenes with Amber Techel | Film & Shoots
description: Behind the scenes with Amber Techel - exclusive photos from film sets, music shoots, and production locations.
og:image: /global-images/og-image.webp
-->
<style>
    .main-content { background-image: url('/templates/Behind the scenes/background/bkgrnd.png'); }
</style>

<div class="bts-header">
    <h1>Behind the Scenes</h1>
    <p>{{BTS_SUBTITLE}}</p>
</div>

<div class="bts-gallery" id="btsGallery">
    <!-- Images will be loaded dynamically -->
</div>

<script>
    const btsImages = {{BTS_IMAGES_JSON}};

    const gallery = document.getElementById('btsGallery');

    btsImages.forEach(imagePath => {
        const card = document.createElement('div');
        card.className = 'bts-image-card';

        const link = document.createElement('a');
        link.href = imagePath;
        link.target = '_blank';

        const img = document.createElement('img');
        img.src = imagePath;
        img.alt = 'Behind the scenes photo';
        img.loading = 'lazy';

        link.appendChild(img);
        card.appendChild(link);
        gallery.appendChild(card);
    });
</script>
