[package]
name = "website-test"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
image = { version = "*", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "*"
ab_glyph = "*"
webp = "*"

[lib]
name = "website_test"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "generate-static"
path = "src/generate_static.rs"
